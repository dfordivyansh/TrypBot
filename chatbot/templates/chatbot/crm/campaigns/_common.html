{# Shared styles + JS helpers for the campaign / audience pages #}
<style>
  /* status badges (campaigns + recipients) */
  .st { display:inline-flex; align-items:center; gap:.375rem; padding:.125rem .625rem; border-radius:9999px;
        font-size:.72rem; font-weight:600; line-height:1.25rem; border:1px solid transparent; white-space:nowrap; }
  .st-draft     { background:#f3f4f6; color:#4b5563; border-color:#e5e7eb; }
  .st-scheduled { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
  .st-running   { background:#ecfdf5; color:#047857; border-color:#a7f3d0; }
  .st-paused    { background:#fffbeb; color:#b45309; border-color:#fde68a; }
  .st-completed { background:#f0fdfa; color:#0f766e; border-color:#99f6e4; }
  .st-cancelled { background:#f1f5f9; color:#475569; border-color:#e2e8f0; }
  .st-failed    { background:#fef2f2; color:#b91c1c; border-color:#fecaca; }
  .st-pending   { background:#f3f4f6; color:#6b7280; border-color:#e5e7eb; }
  .st-sending   { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
  .st-sent      { background:#f8fafc; color:#475569; border-color:#e2e8f0; }
  .st-delivered { background:#ecfdf5; color:#047857; border-color:#a7f3d0; }
  .st-read      { background:#e0f2fe; color:#0369a1; border-color:#bae6fd; }
  .st-skipped   { background:#f1f5f9; color:#64748b; border-color:#e2e8f0; }
  .st-dot { width:.4rem; height:.4rem; border-radius:9999px; background:currentColor; }
  .st-running .st-dot { animation: stPulse 1.4s ease-in-out infinite; }
  @keyframes stPulse { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.35; transform:scale(.7);} }

  /* tag chip */
  .tag-chip { display:inline-flex; align-items:center; gap:.25rem; padding:.05rem .5rem; border-radius:9999px;
              font-size:.7rem; font-weight:600; border:1px solid; white-space:nowrap; }

  /* progress */
  .pbar { height:.5rem; background:#e5e7eb; border-radius:9999px; overflow:hidden; }
  .pbar > span { display:block; height:100%; background:#25D366; border-radius:9999px; transition:width .5s ease; }

  /* inputs */
  .fld { width:100%; border:1px solid #d1d5db; border-radius:.6rem; padding:.55rem .75rem; font-size:.875rem; background:#fff; }
  .fld:focus { outline:none; border-color:#25D366; box-shadow:0 0 0 3px rgba(37,211,102,.18); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; padding:.55rem 1rem; border-radius:.6rem;
         font-size:.875rem; font-weight:600; transition:background .15s, opacity .15s; cursor:pointer; white-space:nowrap; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-primary { background:#25D366; color:#fff; }
  .btn-primary:hover:not(:disabled) { background:#1aab52; }
  .btn-outline { background:#fff; color:#374151; border:1px solid #d1d5db; }
  .btn-outline:hover:not(:disabled) { background:#f9fafb; }
  .btn-danger { background:#dc2626; color:#fff; }
  .btn-danger:hover:not(:disabled) { background:#b91c1c; }
  .btn-sm { padding:.35rem .7rem; font-size:.8rem; }
  .card { background:#fff; border:1px solid #e5e7eb; border-radius:1rem; }

  /* toast */
  #toast-wrap { position:fixed; bottom:1rem; right:1rem; z-index:200; display:flex; flex-direction:column; gap:.5rem; max-width:22rem; }
  .toast { padding:.7rem 1rem; border-radius:.75rem; color:#fff; font-size:.85rem; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.18);
           animation: toastIn .2s ease-out; }
  .toast-ok { background:#0d5c38; } .toast-err { background:#b91c1c; }
  @keyframes toastIn { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }

  /* modal */
  .modal-backdrop { position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:150; display:flex; align-items:center; justify-content:center; padding:1rem; }
  .modal-box { background:#fff; border-radius:1rem; width:100%; max-width:28rem; max-height:90vh; overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,.3); }
  @media (max-width: 767px) { #toast-wrap { left:1rem; bottom:4.5rem; max-width:none; } }
</style>

<div id="toast-wrap"></div>

<script>
  const CSRF = "{{ csrf_token }}";

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtNum(n) { return Number(n || 0).toLocaleString('en-IN'); }
  function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }
  function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

  async function api(url, body) {
    const isForm = body instanceof FormData;
    const opts = { credentials: 'same-origin', headers: { 'X-CSRFToken': CSRF } };
    if (body !== undefined) {
      opts.method = 'POST';
      if (isForm) opts.body = body;
      else { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    }
    let r, data;
    try { r = await fetch(url, opts); }
    catch (e) { return { success: false, error: 'Network error — please check your connection.' }; }
    try { data = await r.json(); }
    catch (e) {
      return { success: false, error: (r.status === 403 || r.redirected)
        ? 'Your session has expired — please refresh the page and log in again.'
        : 'Unexpected server response (' + r.status + ').' };
    }
    if (!r.ok && data.success !== false) data.success = false;
    return data;
  }

  function toast(msg, kind) {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind === 'err' ? 'toast-err' : 'toast-ok');
    el.textContent = msg;
    document.getElementById('toast-wrap').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, kind === 'err' ? 6000 : 3200);
  }

  /* Generic modal. `html` is trusted markup built by the caller (escape user data with esc()). */
  function showModal(html, onMount) {
    const root = document.createElement('div');
    root.className = 'modal-backdrop';
    root.innerHTML = '<div class="modal-box">' + html + '</div>';
    document.body.appendChild(root);
    const close = () => root.remove();
    root.addEventListener('mousedown', e => { if (e.target === root) close(); });
    root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
    if (onMount) onMount(root, close);
    return close;
  }

  function confirmModal({ title, message, okText = 'Confirm', danger = false }) {
    return new Promise(resolve => {
      const close = showModal(
        '<div class="p-6">' +
          '<h3 class="text-lg font-bold text-gray-800">' + esc(title) + '</h3>' +
          '<p class="text-sm text-gray-600 mt-2 whitespace-pre-line">' + esc(message) + '</p>' +
          '<div class="flex justify-end gap-2 mt-6">' +
            '<button class="btn btn-outline" data-act="no">Cancel</button>' +
            '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" data-act="yes">' + esc(okText) + '</button>' +
          '</div></div>',
        (root, closeFn) => {
          root.querySelector('[data-act=no]').onclick = () => { closeFn(); resolve(false); };
          root.querySelector('[data-act=yes]').onclick = () => { closeFn(); resolve(true); };
          root.addEventListener('mousedown', e => { if (e.target === root) resolve(false); });
        });
    });
  }

  function tagChip(t) {
    return '<span class="tag-chip" style="background:' + esc(t.color) + '22;color:' + esc(t.color) + ';border-color:' + esc(t.color) + '55">' + esc(t.name) + '</span>';
  }
  function statusBadge(status, label) {
    return '<span class="st st-' + esc(status) + '"><span class="st-dot"></span>' + esc(label || status) + '</span>';
  }
  const STATUS_LABELS = { draft:'Draft', scheduled:'Scheduled', running:'Running', paused:'Paused', completed:'Completed',
    cancelled:'Cancelled', failed:'Failed', pending:'Pending', sending:'Sending', sent:'Sent', delivered:'Delivered',
    read:'Read', skipped:'Skipped' };
</script>
